Zom1_1:
  Type: ZOMBIE
  Display: '<#FFAF9B>☠ &8[<#FF7D5C>Quái&8] <#83FF29>Zombie &r&8[&c<caster.hp{round=0}><&heart>&8]'
  Health: 75
  Damage: 5
  Skills:
  - randomskill{skills=PushUpLeft,PushUpRight,PushUpForward,PushUpBackward} @self ~onSpawn
  - setname{n=<caster.name>;delay=2} @self ~onDamaged
  - cmd{c="ss give <target.name> zombie 1"} ~onDeath 0.01
