EVENT_THREE_FOUR_PILE: ## The secondary mob connected to the undying skeleton. Essentially waits for the signal from the necromancer before reviving, or else removes itself after a while ##
  Type: SKELETON
  Display: '<#FFB693>☠ &8[<#FF651B>Trùm&8] &fBạch Mã <#8A00FF>Hoảng Tử <#FFB693>☠'
  Health: 10
  Damage: 0
  Faction: BOSS_EVENT
  Disguise: Armor_Stand setYModifier -1.4 setInvisible true setCustomNameVisible false setNoBasePlate true setRightArm 300,180,290
  Skills:
  - effect:itemspray{item=BONE;amount=3;velocity=0.2;d=30;ap=false} @selfLocation ~onSpawn
  - effect:particles{p=ash;a=<random.1to3>;hs=0.32;vs=0.8;y=0.3} @self ~onTimer:1
  - effect:particles{p=soul;a=1;hs=0;vs=0.8;y=0.3} @self ~onDeath
  - sound{s=block.lava.extinguish;p=0.61;sc=master;v=0.88} @self ~onDeath
  - sound{s=entity.skeleton.death;p=0.81;sc=master;v=1.38} @self ~onDeath
#  - skill{s=UndyingSkeletonResAni} @self ~onSignal:ResTrigger
  - remove{delay=200} @self ~onSpawn
  Equipment:
  - EVENT_THREE_FOUR__HEAD_TW HEAD
  - EVENT_THREE_FOUR__SWORD HAND
  - AIR CHEST
  - AIR LEGS
  - AIR FEET
  Options:
    Silent: true
    NoAI: true
    Invincible: true
    Collidable: false
    ApplyInvisibility: true
    KnockbackResistance: 1.0
    PreventOtherDrops: true
    Despawn: true
    NoDamageTicks: 6
    MovementSpeed: 0.00
    PreventSunburn: true