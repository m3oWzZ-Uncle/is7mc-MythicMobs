  AIGoalSelectors:
  - clear
  AITargetSelectors:
  - clear
  Options:
    AlwaysShowName: true
    FollowRange: 80
    MaxCombatDistance: 60
    Despawn: false
    MovementSpeed: 0.23
    PreventItemPickup: true
    PreventRandomEquipment: true
    PreventRenaming: true
    PreventSunburn: true
    KnockbackResistance: 1
    PreventOtherDrops: true
    PreventMobKillDrops: true
    Silent: true
    Height: 3
  Equipment:
  - trim_item CHEST
  - trim_item LEGS
  - trim_item BOOTS
  DamageModifiers:
  - DROWNING 0
  - BLOCK_EXPLOSION 0
  - ENTITY_EXPLOSION 0
  - POISON 0.1
  - MAGIC 0.1
  - DRAGON_BREATH 0
  - WITHER -2
  - FALLING_BLOCK 0
  - THORNS 0
  - LAVA 0
  - MELTING 0
  - FIRE_TICK 0
  - FIRE 0
  - HOT_FLOOR 0
  - FALL 0
  - SUFFOCATION 0
  - PROJECTILE 0.8
  - CONTACT 0
