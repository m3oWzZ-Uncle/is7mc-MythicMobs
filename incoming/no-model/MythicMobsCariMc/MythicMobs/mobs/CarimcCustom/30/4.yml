  - '&f<target.name> &7Bị giết bởi <caster.display>'
  Drops:
  - exp 1
  Skills:
  - sound{s=entity.armor_stand.hit;v=1.0;p=0.7} @self ~onDamaged 1
  - sound{s=entity.armor_stand.fall;v=0.8;p=1.0} @self ~onDamaged 1
  - sound{s=entity.wither_skeleton.hurt;v=0.8;p=0.4} @self ~onDamaged 1
  - sound{s=entity.pillager.death;v=1.0;p=0.3} @self ~onDeath 1
  - sound{s=entity.wither.break_block;v=0.5;p=0.4} @self ~onDeath 1
  - sound{s=entity.wither_skeleton.ambient;v=0.5;p=0.6} @self ~onTimer:60
  - effect:itemspray{item=GHAST_TEAR;amount=8;velocity=1;yvelocity=1;d=50} @self ~onDamaged 0.5
  
  - randomskill{skills=EVENT_THREE_FOUR_SKILL_2 0.3,EVENT_THREE_FOUR_SKILL_3 0.3} ~onAttack 0.6
  - randomskill{skills=EVENT_THREE_FOUR_SKILL_1 0.3,EVENT_THREE_FOUR_SKILL_2 0.3,EVENT_THREE_FOUR_SKILL_3 0.3} <25% ~onAttack 0.6

  - skill{s=EVENT_THREE_FOUR_HEAL} <25% ~onTimer:10 1

  - skill{s=EVENT_THREE_FOUR_COMBATL_1} ~onAttack 0.3
  - skill{s=EVENT_THREE_FOUR_COMBATL_2} ~onAttack 0.3
  - skill{s=EVENT_THREE_FOUR_COMBATL_3} @target <25% ~onAttack 1
  - effect:spin{d=5;v=-60} @self <25% ~onAttack

  - skill{s=EVENT_THREE_FOUR_ONSPAWN} ~onSpawn 1
  - skill{s=EVENT_THREE_FOUR_WIN} ~OnDeath 1
  - sendtitle{title="<#FFB693>☠ &8[<#FF651B>Trùm&8] &fBạch Mã <#8A00FF>Hoảng Tử <#FFB693>☠";subtitle="&8○ &fđã hồi sinh &8○";d=100} @Server ~onSpawn
  - sendtitle{title="<#FFB693>☠ &8[<#FF651B>Trùm&8] &fBạch Mã <#8A00FF>Hoảng Tử <#FFB693>☠";subtitle="&8○ &fđã bị giết bởi <#3DFFD0><trigger.name> &8○";d=100} @Server ~onDeath
