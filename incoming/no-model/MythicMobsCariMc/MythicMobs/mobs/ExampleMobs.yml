HOAKYLAN_MOBS:
  MobType: horse
  Faction: DARK
  Health: 10
  Damage: 1
#  Disguise: horse Unknown setSkin alexis_machin setAddEntityAnimations true setCapeEnabled false setDynamicName true
  Options:
    Tameable: false
    Tamed: true
    Silent: true
    Despawn: true
    PreventSunburn: true
    PreventItemPickup: true
    PreventLeashing: true
    PreventOtherDrops: true
    PreventRandomEquipment: true
    PreventRenaming: true
    PreventJockeyMounts: true
    PreventTransformation: true
    NoAI: false
  KillMessages:
  - '&f<target.name> &7was slain by <caster.display>'
  AIGoalSelectors:
  - clear
  - meleeattack
  AITargetSelectors:
  - clear
  - players
  Skills:
  - sound{s=entity.warden.hurt;v=1.0;p=1.2} @self ~onDamaged 1
  - sound{s=entity.warden.death;v=1.0;p=1.2} @self ~onDeath 1
  - sound{s=entity.warden.ambient;v=1.0;p=1.2} @self ~onTimer:160 0.5
  - sound{s=entity.warden.heartbeat;v=1.0;p=1.2} @self ~onTimer:160 0.5
  - sound{s=entity.horse.gallop;v=1.0;p=1.2} @EIR{r=3} ~onTimer:3 1

  - effect:particles{p=reddust;color=#006d70;amount=50;hS=1;vS=1;speed=0;y=0.5} @self ~onTimer:10 1
  - effect:particles{p=flame;amount=2;speed=0;hS=1;vS=1} @self ~onTimer:10 1
  - effect:particles{p=small_flame;amount=2;speed=0.2;hS=1;vS=1} @self ~onTimer:10 1
  - remove{delay=300} @self ~onSpawn

  - damage{a=30-40} @EIR{r=3} ~onTimer:5 1
  
  - saddle @self ~onSpawn


