LArctic_Arise:
  Type: WOLF
  Disguise: PIGLIN_BRUTE
  Display: '<#FFAF9B>☠ &8[<#FF7D5C>Arise&8] <#83FF29>Shadow Warrior'
  Health: 1000
  Armor: 10000
  Damage: 60
  Skills:
  - sethealth{a=500} @self ~onDamaged
  - skill{s=LFrost_Strike} @self ~onAttack
  - skill{s=LArcticSummon-Heal} @self ~onAttack
  - randomskill{skills=PushUpLeft,PushUpRight,PushUpForward,PushUpBackward} @self ~onSpawn
  - setname{n=<caster.name>;delay=2} @self ~onDamaged
  - skill{s=LArcticSummon-Death;delay=220} @self ~onSpawn
  Equipment:
  - LarcticSpear HAND
  - LarcticHelmet HEAD
  - LarcticChestplate CHESTPLATE
  - LarcticLeggings LEGS
  - LarcticBoots BOOTS
  - LarcticShield OFFHAND
  Options:
    AlwaysShowName: true
    Silent: true
    Despawn: true
    MovementSpeed: 0.35
    MaxCombatDistance: 25
    PreventOtherDrops: true
    PreventSunburn: true
    Invincible: true
  Modules:
    ThreatTable: true
  DamageModifiers:
  - FALL 0
  AIGoalSelectors:
  - 0 clear
  - 1 meleeattack
  - 2 movetowardstarget
  - 3 randomstroll
  - 4 gotoowner
  AITargetSelectors:
  - 0 clear
  - 1 ownertarget
  - 2 ownerattacker

