template_rank_model:
  Type: ARMOR_STAND
  AIGoalSelectors:
  - clear
  AITargetSelectors:
  - clear
  Options:
    Collidable: false
    MovementSpeed: 0
    Invincible: true
    Invisible: true
    Despawn: persistent
    Silent: true
    PreventOtherDrops: true
  Skills:
  - skill{s=[
            - model{mid=<caster.mythic_type>;damagetint=false}
            - delay 70
            - remove @self
            ]} @self ~onSpawn

