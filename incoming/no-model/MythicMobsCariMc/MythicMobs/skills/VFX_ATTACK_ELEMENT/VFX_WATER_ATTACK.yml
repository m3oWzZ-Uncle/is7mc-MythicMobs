VFX_WATER_DAMAGE_D:
  Skills:
  - skill{s=VFX_WATER_DAMAGE} @EntitiesNearOrigin{r=3}
  
VFX_WATER_DAMAGE:
  Skills:
  - damage{a="<modifier.damage>";pkb=true;hnp=true;hp=true;delay=1}
  - skill{s=VFX_WATER_EFFECT} 0.2

VFX_WATER_DAMAGE_D2:
  Skills:
  - skill{s=VFX_WATER_DAMAGE2;delay=3} @EntitiesNearOrigin{r=4}
  
VFX_WATER_DAMAGE2:
  Skills: 
  - damage{a="<modifier.damage> * 1.5";pkb=true;hnp=true;hp=true;delay=1}
  - skill{s=VFX_WATER_EFFECT} 0.2
  
  

VFX_WATER_EFFECT:
  Skills:
  - Aura{auraName=VFX_WATER_AURA;duration=80}
