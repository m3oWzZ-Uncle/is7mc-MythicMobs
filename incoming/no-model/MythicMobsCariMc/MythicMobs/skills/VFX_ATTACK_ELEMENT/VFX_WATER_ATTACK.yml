VFX_WATER:
  Conditions:
  - crouching false
  Skills:
  - skill{s=VFX_WATER_1}
  - skill{s=VFX_WATER_2}
  - skill{s=VFX_WATER_3}
  - skill{s=VFX_WATER_4}
  
VFX_WATER_1:
  Conditions:
  - hasaurastacks{auraName=VFX_WATER_Stack;stacks=1} false
  - hasaurastacks{auraName=VFX_WATER_Stack;stacks=2} false
  - hasaurastacks{auraName=VFX_WATER_Stack;stacks=3} false
  Skills:
  - Aura{auraName=VFX_WATER_Stack;duration=120;maxStacks=3;delay=1} @self
  - effect:sound{s=entity.player.swim;volume=0.7;pitch=1.3} @self
#  - effect:sound{s=entity.wither.shoot;volume=0.4;pitch=1.5} @self
