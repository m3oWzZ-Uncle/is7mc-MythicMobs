  - summon{type=VFX_WATER_ATTACK_MOBS_V2;amount=1;radius=0;yRadius=0;onSurface=true} @self
  

VFX_WATER_3:
  Conditions:
  - hasaurastacks{auraName=VFX_WATER_Stack;stacks=1} false
  - hasaurastacks{auraName=VFX_WATER_Stack;stacks=2} true
  - hasaurastacks{auraName=VFX_WATER_Stack;stacks=3} false
