CR_CanonBeeTOWINONE:
  Skills:
  - skill{s=CR_CanonBee_Fall} @self
  - skill{s=CR_CanonBee} @self

CR_CanonBee_Fall:
  Conditions:
  - onground false
  Skills:
  - leap{velocity=250} @forward{f=4;y=5;lockpitch=true}
  - delay 5
  - potion{type=SLOW;duration=20;level=4;hasParticles=false} @self
  - delay 15
  - effect:particles{p=sonic_boom;amount=2;y=1.8} @self
  - delay 2
  - leap{velocity=250} @forward{f=-5;lockpitch=true}
  - projectile{bulletType=MOB;mob=CANONBEE_MOBS;oT=CR_CanonBee_Tick;oH=CR_CanonBee_hit;oE=CR_CanonBee_End;=1;v=30;mr=60;sE=true;vO=0.2;g=0.8} @targetlocation
CR_CanonBee:
  Conditions:
  - onground true
  Skills:
  - potion{type=SLOW;duration=20;level=4;hasParticles=false} @self
  - delay 15
  - effect:particles{p=sonic_boom;amount=2;y=1.8} @self
  - delay 7
  - leap{velocity=120} @forward{f=-4;lockpitch=true}
  - projectile{bulletType=MOB;mob=CANONBEE_MOBS;oT=CR_CanonBee_Tick;oH=CR_CanonBee_hit;oE=CR_CanonBee_End;=1;v=30;mr=60;sE=true;vO=0.2;g=0.8} @targetlocation
CR_CanonBee_Tick:
  Skills:
  - sound{s=entity.shulker.shoot;v=1;sc=hostile;p=1.3}
#  - sound{s=entity.bee.loop;v=1;sc=hostile;p=1.3}
  - effect:particles{p=block_crack;material=bee_nest;amount=2;hs=0.3;vs=0.3} @origin
  - effect:particles{p=block_crack;material=honeyblock;amount=2;hs=0.3;vs=0.3} @origin
  - effect:particles{p=block_crack;material=honeycomb_block;amount=2;hs=0.3;vs=0.3} @origin
  - effect:particles{p=reddust;a=20;color=#ff9e4e;s=1;hs=0.3;vs=0.3} @origin
CR_CanonBee_hit:
  Skills:
  - damage{a="<modifier.damage>";i=true}
  - potion{type=POISON;duration=140;level=4;hasParticles=false}

CR_CanonBee_End:
  Skills:
  - summon{type=CANONBEE_MOBS_ENDS;amount=5;radius=7}
  - summon{type=CANONBEE_MOBS_ENDS;amount=1}