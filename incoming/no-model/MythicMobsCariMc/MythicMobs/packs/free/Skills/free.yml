FlowerFastShoot:
  Skills:
  - projectile{bulletType=ITEM;material=netherite_sword;v=50;i=1;mr=100;hnp=true;oT=FlowerTick;oH=FlowerHit;size=10;sso=0;sfo=0} @Targetlocation
  
FlowerTick:
  Skills:
  - effect:particles{particle=reddust;color=#f9a4f0;a=5;hs=0.2;vs=0.2} @origin
  - effect:particles{particle=reddust;color=#fdfdfd;a=5;hs=0.2;vs=0.2} @origin
  - sound{s=entity.evoker.prepare_attack;v=0.3}
FlowerHit:
  Skills:
  - damage{amount="<modifier.damage>";ignoreArmor=true}
  - delay 5
  - teleport{spreadh=0;spreadv=0} @target
  - sound{s=entity.enderman.teleport;v=5} @EIR{r=20}
  - delay 10
  - effect:particlesphere{particle=reddust;color=#fcb4f5;amount=1000;radius=2.5;size=2;y=1} @self
  - sound{s=block.grass.hit;v=1;p=0.01}
  - sound{s=block.grass.hit;v=1;p=0.5}
  - delay 5
  - sound{s=block.grass.hit;v=1;p=0.5}

  - damage{amount="<modifier.damage>";ignoreArmor=true} @EIR{r=4}

