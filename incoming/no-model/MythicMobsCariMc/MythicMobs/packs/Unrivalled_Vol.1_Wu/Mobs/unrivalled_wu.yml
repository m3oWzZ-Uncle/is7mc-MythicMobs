
##==========================================[ Summoner ]===========================================

ink[Main]Wu_summoner:
  Type: ARMOR_STAND
  Options:
    Marker: true
    Invisible: true
  Skills:
  - model{mid=ink_spawn_main} @self ~onSpawn
  - bodyclamp{m=ink_spawn_main;mh=0;md=0} @self ~onSpawn
  - skill{s=ink_spawn_main} @self ~onInteract

##==========================================[Adjustable Mobs]===========================================

ink[Main]Wu:
  Type: husk
  Display: '&6Wu' #Change the name of the mob here
  Health: 1000 #Adjust Boss Health here
  Damage: 1  #Adjust damage here
  AIGoalSelectors:
  - 0 clear
  - 1 meleeattack
  - 2 randomstroll
  AITargetSelectors:
  - players
  Modules:
    ThreatTable: true
  Options:
    PreventOtherDrops: true
    Silent: true
    FollowRange: 50
    PreventItemPickup: true
    PreventRandomEquipment: true
    MovementSpeed: 0.21
    KnockbackResistance: 1
    PreventJockeyMounts: true
    NoAI: true
  BossBar:
    Enabled: true
    Title: '&6Wu'
    Range: 40
    Color: RED
    Style: SEGMENTED_10
  Skills:
  ##======[Internal Setup]======= 
  - model{mid=ink_panda} @self ~onSpawn
  - bodyclamp{m=ink_panda;mh=30;mb=0} @self ~onSpawn
  - partvisibility{m=ink_panda;p=brush_summon;v=false;delay=1} @self ~onSpawn
  - CancelEvent{sync=true} @self ~onAttack
  - gcd{ticks=80} @self ~onSpawn
  - setAI{ai=true;delay=60} @self ~onSpawn
  - addtag{t=walk;delay=1} @self ~onSpawn
  - setstance{stance=normal;delay=1} @self ~onSpawn
  - skill{s=ink_panda_animation} @target ~onTimer:20
  
  ##======[Mob Abilities]=======
  - skill{s=ink_panda_dodge;sync=true} @self ~onDamaged 0.8 #dodge skill
  - randomskill{s=ink_panda_slash,ink_panda_uppercut,ink_panda_kick2,ink_panda_kick,ink_panda_slash2} @target ~onTimer:20 #random attack
  - skill{s=ink_panda_summon_phase1} @self =80% #ultimate skill phase 1 in 80% health
  - skill{s=ink_panda_summon_phase2} @self =50% #ultimate skill phase 2 in 50% health
  - skill{s=ink_panda_summon_phase3} @self =20% #ultimate skill phase 3 in 20% health
  - skill{s=ink_dragon_summon_dying} @RingAroundOrigin{yoffset=0;points=12;radius=5;sort=random;limit=1} ~onTimer:80 #keeping summon ink dragon after ultimate skill phase 3
  
  ##======[Cosmetic Effects]=======
  - skill{s=ink_panda_vfx} @self ~onTimer:1 #Ambient effect
  - skill{s=ink_panda_hurt} @self ~onDamaged 0.7  #Hurt effect
  - skill{s=ink_panda_death} @self ~onDeath  #Death effect
  - sound{s=item.armor.equip_leather;v=2.6;p=0.9} @self ~onDamaged #Hurt sound effect

ink[Main]Ink_Tiger: # summon in Wu's ultimate skill phase 3
  Type: husk
  Display: '&6Ink Tiger' #Change the name of the mob here
  Health: 10 #Adjust health here
  Damage: 1 #Adjust damage here
  AIGoalSelectors:
  - 0 clear
  - 1 meleeattack
  - 2 randomstroll
  AITargetSelectors:
  - players
  Modules:
    ThreatTable: true
  Options:
    PreventOtherDrops: true
    Silent: true
    FollowRange: 50
    PreventItemPickup: true
    PreventRandomEquipment: true
    MovementSpeed: 0.36
    KnockbackResistance: 1
    PreventJockeyMounts: true
    NoAI: true
  Skills:
   ##======[Internal Setup]======= 
  - setAI{ai=true;delay=10} @self ~onSpawn
  - gcd{ticks=10} @self ~onSpawn
  - model{mid=ink_tiger_mob} @self ~onSpawn
  - bodyclamp{m=ink_tiger_mob;mh=30;mb=0} @self ~onSpawn
  - CancelEvent{sync=true} @self ~onAttack
  
  ##======[Mob Abilities]=======
  - skill{s=ink_tiger_mob} @target ~onTimer:10
  
  ##======[Cosmetic Effects]=======
  - summon{t=ink[VFX]vfx_ink_pop_initial} @self ~onDeath
  - effect:particles{particle=reddust;color=#000000;amount=40;hs=1.4;vs=0.4;y=0.4;size=2;s=0.1} @self ~onDeath
  - effect:sound{s=entity.player.splash;v=0.7;p=1.1} @self ~onDeath
  - summon{t=ink[VFX]ink_circle_initial} @Self ~onDeath


