

SoulWeaver_Slash:
  Cooldown: 0.3
  Skills:
  - potion{t=SLOW_DIGGING;l=5;d=7;p=false;i=false} @self
  - summon{type=Soulweaver_Slash_FX_1;amount=1;radius=0} @Forward{f=1.75}
  - skill{s=SoulWeaver_Slash_Damage} @EIC{a=135;r=3.5;rot=0} 
  - randomskill{skills=[ - sound{s=soulweaver_set:custom.soulweaver_set.airslash1;sc=players;v=0.55;audience=WORLD} @selflocation],[ - sound{s=soulweaver_set:custom.soulweaver_set.airslash2;sc=players;v=0.75;audience=WORLD} @selflocation],[ - sound{s=soulweaver_set:custom.soulweaver_set.airslash3;sc=players;v=0.75;audience=WORLD} @selflocation]}

SoulWeaver_Slash_Damage:
  TargetConditions:
  - mythicmobtype{t=Soulweaver_Spirit_Surge_Soul} castinstead SoulWeaver_Slash_SoulSlash_SFX
  Skills:
  - damage{a="<modifier.damage>"} 

SoulWeaver_Slash_SoulSlash_SFX:
  Conditions:
  - offgcd
  Skills:
  - gcd{t=2} 
  - damage{a="<modifier.damage>"} 
  - randomskill{skills=[ - sound{s=soulweaver_set:custom.soulweaver_set.slash1;sc=players;v=0.65;audience=WORLD} @selflocation],[ - sound{s=soulweaver_set:custom.soulweaver_set.slash2;sc=players;v=0.65;audience=WORLD} @selflocation],[ - sound{s=soulweaver_set:custom.soulweaver_set.slash3;sc=players;v=0.65;audience=WORLD} @selflocation]}
