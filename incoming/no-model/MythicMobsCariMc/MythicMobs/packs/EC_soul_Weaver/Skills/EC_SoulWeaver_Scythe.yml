SoulWeaver_Descension:
  Skills: 
  - Aura{auraName=Check_SoulWeaver_Scythe_Holding;oS=SoulWeaver_Apply_FXS;oT=SoulWeaver_Cosmetics_Equip;i=1;d=20;ma=true;rd=true;ms=1;cod=true} @self

SoulWeaver_Apply_FXS:
  Conditions:
  - health{h=0} false
  Skills:
  - sound{s=soulweaver_set:custom.soulweaver_set.soulleave;sc=blocks;v=0.25;p=0.5} @selflocation 
  - sound{s=minecraft:item.armor.equip_netherite;v=0.5} @selflocation 
  - skill{s=SoulWeaver_Cosmetics_Particle} @self 

SoulWeaver_Cosmetics_Equip:
  Conditions:
  - wearing{slot=HAND;m=SoulWeaver_Scythe} orElsecast SoulWeaver_Cosmetics_Unequip 
  Skills:
  - command{c="cosmetics <caster.name> add soulweaver_chestplate";asOp=true;asTarget=self} @self
  - command{c="cosmetics <caster.name> add soulweaver_helmet";asOp=true;asTarget=self} @self

SoulWeaver_Cosmetics_Particle: 
  Cooldown: 1
  Skills:
  - effect:particles{p=reddust;color=#59cf93;a=60;size=2;hS=0.25;vS=0.5} @Forward{f=0.5;y=1.0}
  - effect:particles{p=reddust;color=#b5e7cb;a=60;size=2;hS=0.25;vS=0.5} @Forward{f=0.5;y=1.0}

SoulWeaver_Cosmetics_Unequip:
  Skills:
  - skill{s=SoulWeaver_Cosmetics_Particle}
  - delay 3
  - command{c="cosmetics <caster.name> remove soulweaver_chestplate";asOp=true;asTarget=self} @self
  - command{c="cosmetics <caster.name> remove soulweaver_helmet";asOp=true;asTarget=self} @self


