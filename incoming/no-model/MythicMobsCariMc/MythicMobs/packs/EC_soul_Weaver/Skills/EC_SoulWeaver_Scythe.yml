Check_SoulWeaver_Nether_Grasp:
  Skills:
  - skill{s=Check_SoulWeaver_Nether_Grasp_Check_Owner} @owner
  - skill{s=Check_SoulWeaver_Nether_Grasp_Entities} @EIC{r=2.25}
  - setrotation{relative=true;yaw=1} @self 

Check_SoulWeaver_Nether_Grasp_Check_Owner:
  TargetConditions:
  - targetwithin{d=30} false
  Skills:
  - remove @self

Check_SoulWeaver_Nether_Grasp_Entities:
  TargetConditions:  
  - mythicmobtype{t=Soulweaver_Spirit_Surge_Soul} castinstead Check_SoulWeaver_Nether_Hand
  - hastag{t=EC_Skill} false
  - owner false
  Skills:
  - skill{s=Check_SoulWeaver_Nether_Hand} @self

Check_SoulWeaver_Nether_Hand:
  Skills:
  - remove{delay=50} @self
  - sudoskill{s=Check_SoulWeaver_Summon_Hand;cat=true} @owner

Check_SoulWeaver_Summon_Hand:
  Skills:
  - summon{type=Soulweaver_Nether_Grasp_Hand;amount=1;radius=0;sio=true;cooldown=4} @TriggerLocation

Soulweaver_Nether_Grasp_Hand_DamageUP:
  Skills:
  - totem{ch=1;i=1;md=40;hR=2;vR=2;oH=Soulweaver_Nether_Grasp_Damage;hp=true;hnp=true} @TriggerLocation

Soulweaver_Nether_Grasp_Damage:
  Skills:
  - potion{t=LEVITATION;l=24;d=5;p=false;i=false} 
  - velocity{m=MULTIPLY;y=5;delay=20} 
  - damage{a="<caster.var.nether_grasp_damage>"} 

