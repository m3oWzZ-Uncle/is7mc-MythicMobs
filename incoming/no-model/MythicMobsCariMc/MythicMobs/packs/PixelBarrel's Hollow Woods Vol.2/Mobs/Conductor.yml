HOL2[SYS]_Conductor-RippleMarkerMarker:
  Type: ARMOR_STAND
  Skills:
  - summon{type=HOL2[SYS]_Conductor-Ripples;amount=1;r=4;yr=4;os=true;repeat=2;repeatInterval=8} @Self ~onSpawn
  - sound{s=entity.wither.break_block;p=0.5;v=1;delay=40} @Self ~onSpawn
  - summon{type=HOL2[SYS]_Conductor-GrippingTeeth;amount=1;r=0;yr=3;os=true;delay=40} @Self ~onSpawn
  - signal{s=Lift} @Parent ~onSignal:Lift
  - skill{s=HOL2_SelfRemove} ~onSpawn
  Options:
    Marker: true
    Invisible: true

