MobstestSkillBankai:
  Type: ARMOR_STAND 
  Health: 1000
  Options.Silent: true
  Options.Invisible: true
  Skills:
  - skill{s=Bankai_Snow} ~onSpawn
  - remove @self ~onTimer:1000
  
