# *Lưu ý: skill sử dụng nhiều particle nên hãy cân nhắc server đủ mạnh, máy của bạn đủ mạnh để chịu được nhé! 
#  và sát thương của kỹ năng cũng to khoảng 30-80,các cơn gió tuyết có thể ánh hưởng tới bản thân bạn
# để dùng skill hãy sử dụng lệnh /mm test cast Bankai_Snow
# để thử theo góc nhìn của kẻ địch sử dụng lệnh /mm mobs spawn MobstestSkillBankai
# Bản quyền thuộc: NOOB123ok
