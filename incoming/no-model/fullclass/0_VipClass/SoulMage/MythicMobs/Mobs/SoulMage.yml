SoulMage_Spirit_Surge:
  Type: ARMOR_STAND
  Options:
    Invincible: true
    Marker: true
    AlwaysShowName: false
    Invisible: true
    HasGravity: false
    HasBasePlate: false
    Small: false
    ApplyInvisibility: true
  Skills:
  - addtag{t=SM_SKILL} @self ~onSpawn
  - equip{item=SoulMage_Shovel:4} @self ~onSpawn
  - animatearmorstand{d=40;head=0,2520,0;ignoreempty=false} @self ~onSpawn
  

SoulMage_Spirit_Surge_Reverse:
  Type: ARMOR_STAND
  Options:
    Invincible: true
    Marker: true
    AlwaysShowName: false
    Invisible: true
    HasGravity: false
    HasBasePlate: false
    Small: false
    ApplyInvisibility: true
  Skills:
  - addtag{t=SM_SKILL} @self ~onSpawn
  - remove{delay=100} @self ~onSpawn 
  - sound{s=entity.arrow.hit_player;sc=players;v=1;delay=90} @selflocation ~onSpawn 
  - missile{bulletType=MOB;mob=SoulMage_Spirit_Surge;oH=SoulMage_Spirit_Surge_Grab_Scythe;oT=SoulMage_Spirit_Surge_Tick;v=20;hR=1;vR=1;hp=true;hnp=true;sfo=-2;syo=-0.25;mr=100;delay=1;sB=false;sE=false} @owner ~onSpawn
  - Aura{auraName=Pulling_Soul;oT=SoulMage_Spirit_Surge_Soul_Collecting;d=100;i=1;rd=true;ma=true;ms=1} @owner ~onSpawn

