  - Aura{auraName=CursedAcolyte_SKILL_PASS_aura;interval=1;duration=60;oT=CursedAcolyte_SKILL_PASS_tick;oE=CursedAcolyte_SKILL_PASS_end} @EIR{r=3}

CursedAcolyte_SKILL_PASS_tick:
