  - potion{type=HUNGER;duration=60;level=20;hasParticles=false} @self
  - damage{a=1} @self
  - effect:particles{particle=dust_color_transition;color=#FF1A72;color2=#CD1AFF;amount=10;speed=0;hS=1;vS=1} @self
CursedAcolyte_SKILL_PASS_end:
  Skills:
  - effect:particles{particle=dust_color_transition;color=#FF1A72;color2=#CD1AFF;amount=10;speed=0;hS=1;vS=1} @self

CursedAcolyte_SKILL_1:
