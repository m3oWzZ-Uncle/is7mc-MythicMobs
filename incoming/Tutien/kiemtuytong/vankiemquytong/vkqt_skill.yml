VAN_KIEM_QUY_TONG:
  Skills:
  - aura{auraName=CASTING;duration=280} @self

  # Khai trận
  - orbital{auraName=VKQT_MAGIC_CIRCLE;bulletType=MOB;mob=VFX_VKQT_MAGIC_CIRCLE;r=0;p=1;duration=250;i=1;rotate=false;offsety=2.8;hp=false;hnp=false;hs=false} @self

  - sound{s=block.enchantment_table.use;v=1.3;p=0.5} @self
  - particles{p=enchant;amount=30;hS=0.8;vS=1;speed=0.05} @self

  # 1.5 giây tụ lực
  - delay 30

  # 24 wave, mỗi wave cách nhau 10 tick
  - skill{s=VKQT_WAVE;repeat=23;repeatInterval=10}
  
VKQT_WAVE:
  Skills:
  - skill{s=VKQT_RANDOM_SWORD}
  - skill{s=VKQT_RANDOM_SWORD}
  - skill{s=VKQT_RANDOM_SWORD}
  - skill{s=VKQT_RANDOM_SWORD}


VKQT_RANDOM_SWORD:
  Skills:
  - setvariable{var=skill.vkqt_side;type=FLOAT;value=<random.float.-9to9>}
  - setvariable{var=skill.vkqt_up;type=FLOAT;value=<random.float.-9to9>}
  - projectile{bulletType=MOB;mob=VFX_VKQT_SWORD;bmd=true;oT=VKQT_SWORD_TICK;oH=VKQT_SWORD_IMPACT;ohb=VKQT_SWORD_IMPACT;v=32;i=1;mr=32;hR=0.55;vR=0.7;hp=true;hnp=true;sE=true;sB=true;hs=false;sfo=1.5;sso=<skill.var.vkqt_side>;eso=<skill.var.vkqt_side>;syo=<skill.var.vkqt_up>;tyo=<skill.var.vkqt_up>;fo=false;rlos=false;tickinterpolation=2;drawhitbox=false;ham=true;hitConditions=[- isLiving true - mmoCanTarget{interaction=OFFENSE_ACTION} true]} @forward{f=32;y=0;lockpitch=true}


VKQT_SWORD_TICK:
  Skills:
  - particles{p=end_rod;amount=1;hS=0.02;vS=0.02;speed=0} @origin
  - particles{p=crit;amount=1;hS=0.03;vS=0.03;speed=0} @origin


VKQT_SWORD_IMPACT:
  Skills:
  - sound{s=entity.player.attack.crit;v=0.35;p=1.65} @origin
  - particles{p=crit;amount=6;hS=0.25;vS=0.25;speed=0.09} @origin
  - particles{p=end_rod;amount=3;hS=0.18;vS=0.18;speed=0.04} @origin
  - skill{s=VKQT_SWORD_DAMAGE} @EntitiesNearOrigin{r=2.5;limit=8;sort=NEAREST;conditions=[- isLiving true - entitytype{t=ARMOR_STAND} false - mmoCanTarget{interaction=OFFENSE_ACTION} true]}

VKQT_SWORD_DAMAGE:
  Skills:
  - mmodamage{amount="<mmostat.attack_damage> * (<modifier.damage> / 100)";pkb=false;hnp=true;hp=true;types=SKILL,PHYSICAL}