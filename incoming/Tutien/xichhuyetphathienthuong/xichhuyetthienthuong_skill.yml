## PASSIVE DASH Lướt Thương

xichhuyetthienthuong_Combo_DASHPASSIVE:
  Cooldown: 0.3
  Conditions:
  - crouching false
  - hasAura{auraName=CASTING} false
  Skills:
  - auraremove{aura=XHPTT_SPEAR_CHARGE;stacks=1} @self
  - aura{auraName=CASTING;duration=8} @self
  - summon{type=VFX_XHPTT_DASH;amount=1;radius=0;yRadius=0;onSurface=false} @selflocation
  - lunge{velocity=3.2;velocityY=0} @forward{f=16;y=-1;lockpitch=true}
  - projectile{oH=XHPTT_DASH_HIT;v=35;i=1;mr=8;hR=0.5;vR=1;hp=true;hnp=true;sE=false;sB=true;syo=0.8;tyo=0.8;sfo=0;ham=true;tickinterpolation=3;immuneDelay=20;hitConditions=[- isLiving true - mmoCanTarget{interaction=OFFENSE_ACTION} true]} @forward{f=8;y=0;lockpitch=true}


XHPTT_DASH_HIT:
  TargetConditions:
  - entitytype{t=ARMOR_STAND} false
  Skills:
  - mmodamage{amount="<mmostat.attack_damage> * (<modifier.damage> / 100)";pkb=false;hnp=true;hp=true;types=SKILL,PHYSICAL}
  - projectile{targetisorigin=true;bulletType=MOB;mob=VFX_XHPTT_IMPACT;v=0;i=1;hR=0;vR=0;mr=2;hnp=false;sE=false;sB=false;hs=false;syo=1.2;tyo=1.2;fo=true;ham=true}


