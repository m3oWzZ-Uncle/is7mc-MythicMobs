## THU HỒI THƯƠNG

xichhuyetthienthuong_Recall:
  Cooldown: 0.3
  Conditions:
  - hasaurastacks{auraName=XHPTT_SPEAR_CHARGE;stacks=2} false
  Skills:
  - sudoskill{s=XHPTT_Spear_Return_CAST;setcasterastrigger=true} @Children{sort=NEAREST;limit=1;conditions=[- mythicmobtype{t=VFX_XHPTT_DROPPED_SPEAR} true - distance{d=<14} true]}


XHPTT_Spear_Return_CAST:
  TriggerConditions:
  - owner true
  - hasAura{auraName=XHPTT_RECALL_LOCK} false
  Skills:

  # Chỉ cho cây gần nhất của owner chạy Recall
  - aura{auraName=XHPTT_RECALL_LOCK;duration=2} @Trigger

  # Ẩn cây thương đang cắm dưới đất
  # idle gốc của model = scale 0
  - defaultstate{m=xichhuyetphathienthuong;t=idle;s=idle;li=0;lo=0} @self

  - sound{s=item.trident.return;p=0.8} @Owner
  - particles{p=dust_color_transition;color1=#8a0000;color2=#ff1a1a;amount=8;hS=0.2;vS=0.2;size=0.45;speed=0.03} @self

  - delay 1

  # Bắn chính cây thương về owner
  - projectile{bulletType=MOB;mob=VFX_XHPTT_RETURN_SPEAR;bmd=true;oT=XHPTT_Spear_Return_TICK;oH=XHPTT_Spear_Return_HIT;v=32;i=1;mr=24;hR=0.8;vR=1;hp=true;hnp=false;sE=true;sB=false;hto=true;rlos=false;immuneDelay=20;ham=true} @Owner


XHPTT_Spear_Return_TICK:
  Skills:
  - particles{p=dust_color_transition;color1=#5c0000;color2=#ff2020;amount=2;hS=0.08;vS=0.08;size=0.3;speed=0} @origin


XHPTT_Spear_Return_HIT:
  TargetConditions:
  - owner true
  - hasaurastacks{auraName=XHPTT_SPEAR_CHARGE;stacks=2} false
  Skills:
  - skill{s=XHPTT_Spear_Aura}
  - sound{s=item.trident.return;p=1.2}
  - particles{p=dust_color_transition;color1=#8a0000;color2=#ff3030;amount=12;hS=0.25;vS=0.4;size=0.4;speed=0.05}
  - remove @self

