xichhuyetthienthuong_Combo:
  Conditions:
  - hasAura{auraName=XHPTT_SPEAR_CHARGE} castinstead xichhuyetthienthuong_Combo_DASHPASSIVE
  Skills:
  - skill{s=xichhuyetthienthuong_Combo_SKILL}

xichhuyetthienthuong_Combo_SKILL:
  Skills:
  - skill{s=xichhuyetthienthuong_Combo_CAST}

xichhuyetthienthuong_Combo_CAST:
  Cooldown: 0.3
  Conditions:
  - crouching false
  - hasAura{aura=CASTING} false
  Skills:
  - skill{s=xichhuyetthienthuong_Combo_ST_1}
  - skill{s=xichhuyetthienthuong_Combo_ST_2}
  - skill{s=xichhuyetthienthuong_Combo_ST_3}


xichhuyetthienthuong_Combo_ST_1:
  Conditions:
  - hasaurastacks{auraName=xichhuyetthienthuong_Combo_Stack;stacks=1} false
  - hasaurastacks{auraName=xichhuyetthienthuong_Combo_Stack;stacks=2} false
  Skills:
  - Aura{auraName=xichhuyetthienthuong_Combo_Stack;duration=300;maxStacks=2;delay=1} @self
  - aura{auraName=CASTING;duration=10} @self
  - projectile{delay=1;onHit=xichhuyetthienthuong_Combo_ST_1_DAMAGE_D;i=1;v=30;hR=2;vR=2;mr=1.5;hnp=true;hO=0;sE=false;sB=false;hs=false;hfs=0;sfo=0;syo=0;tyo=0;sso=0;fo=false;hitConditions=[- isLiving true];byo=0;drawhitbox=false;ham=true} @forward{f=5;y=0;lockpitch=true}
  - summon{type=VFX_XHPTT_COMBO_SWING_LEFT;amount=1;radius=0;yRadius=0;onSurface=false} @forward{f=0.2;y=1.4;sideOffset=0;lockpitch=true}


xichhuyetthienthuong_Combo_ST_1_DAMAGE_D:
