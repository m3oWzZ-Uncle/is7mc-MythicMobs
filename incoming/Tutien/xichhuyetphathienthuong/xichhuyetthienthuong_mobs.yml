    [- state{s=hit_1;speed=1}],
    [- state{s=hit_2;speed=1}],
    [- state{s=hit_3;speed=1}],
    [- state{s=hit_4;speed=1}],
    [- state{s=hit_5;speed=1}],
    [- state{s=hit_6;speed=1}],
    [- state{s=hit_7;speed=1}]} @self ~onSpawn
 

