VFX_XHPTT_IMPACT:
  Type: block_display
  DisplayOptions:
    Block: AIR
    Billboard: FIXED
  Options:
    Invincible: true
    Collidable: false
  Skills:
  - model{usestatemachine=true;mid=xichhuyetphathienthuong_hitvfx;lockpitch=true} @self ~onSpawn
  - BodyRotation{playermode=false;stable=0;rdelay=0;rduration=0} @self ~onSpawn
  - remove{delay=15} @self ~onSpawn
