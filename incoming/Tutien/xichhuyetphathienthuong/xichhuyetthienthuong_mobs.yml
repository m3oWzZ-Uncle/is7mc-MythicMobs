VFX_XHPTT_COMBO_SWING_LEFT:
  Type: block_display
  DisplayOptions:
    Block: AIR
    Billboard: FIXED
  Options:
    Invincible: true
    Collidable: false
  Skills:
  - model{usestatemachine=true;mid=xichhuyetphathienthuong_slash;lockpitch=true} @self ~onSpawn
  - brightness{b=15;s=15} @self ~onSpawn
  - BodyRotation{playermode=false;stable=0;rdelay=0;rduration=0} @self ~onSpawn
  - state{s=l_slash;speed=1} @self ~onSpawn
  - remove{delay=20} @self ~onSpawn
